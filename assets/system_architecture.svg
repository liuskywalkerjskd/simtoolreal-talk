<svg class="visual" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" role="img"><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow-10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1d7d76"/></marker></defs><rect x="25" y="10" width="1065" height="112" rx="3" fill="#f1f5f3" stroke="none"/><text x="45" y="38" fill="#1d7d76" font-size="15" text-anchor="start">1  TRAIN ONCE IN SIMULATION</text><text x="45" y="80" fill="#1a1a1a" font-size="23" text-anchor="start">Primitive tools + random goals</text><path d="M375,74 L434,74" fill="none" stroke="#1d7d76" stroke-width="2.4" marker-end="url(#arrow-10)"/><text x="455" y="80" fill="#1d7d76" font-size="24" text-anchor="start">Physics + RL</text><path d="M640,74 L735,74" fill="none" stroke="#1d7d76" stroke-width="2.4" marker-end="url(#arrow-10)"/><text x="755" y="80" fill="#1d7d76" font-size="24" text-anchor="start">Reusable LSTM policy</text><g class="fragment" data-step="1"><text x="25" y="174" fill="#1d7d76" font-size="15" text-anchor="start">2  SPECIFY A NEW TASK</text><text x="25" y="214" fill="#1a1a1a" font-size="25" text-anchor="start">Human RGB-D demonstration</text><text x="25" y="251" fill="#6c7474" font-size="21" text-anchor="start">Grasp box + 6D pose waypoints</text><path d="M420 238H540V345H555" fill="none" stroke="#1d7d76" stroke-width="2.4" marker-end="url(#arrow-10)"/><text x="595" y="212" fill="#1d7d76" font-size="21" text-anchor="start">Perception supplies geometry</text><text x="595" y="246" fill="#6c7474" font-size="21" text-anchor="start">The mesh supports live pose tracking</text></g><g class="fragment" data-step="2"><text x="25" y="310" fill="#1d7d76" font-size="15" text-anchor="start">3  EXECUTE IN A CLOSED LOOP</text><rect x="25" y="335" width="365" height="72" rx="3" fill="#e8f5f3" stroke="none"/><text x="207" y="365" fill="#1d7d76" font-size="22" text-anchor="middle">Live tool pose + robot state</text><text x="207" y="391" fill="#6c7474" font-size="17" text-anchor="middle">Tracking and proprioception</text><path d="M405,371 L555,371" fill="none" stroke="#1d7d76" stroke-width="2.4" marker-end="url(#arrow-10)"/><rect x="570" y="335" width="250" height="72" rx="3" fill="#e8f5f3" stroke="none"/><text x="695" y="365" fill="#1d7d76" font-size="24" text-anchor="middle">Fixed LSTM actor</text><text x="695" y="391" fill="#6c7474" font-size="17" text-anchor="middle">Current goal + grasp box</text><path d="M835,371 L905,371" fill="none" stroke="#1d7d76" stroke-width="2.4" marker-end="url(#arrow-10)"/><rect x="920" y="335" width="170" height="72" rx="3" fill="#e8f5f3" stroke="none"/><text x="1005" y="365" fill="#1d7d76" font-size="23" text-anchor="middle">Arm + hand</text><text x="1005" y="391" fill="#6c7474" font-size="17" text-anchor="middle">29 joint targets</text><path d="M995 104H1100V286H695V325" fill="none" stroke="#1d7d76" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-10)"/><text x="857" y="275" fill="#6c7474" font-size="17" text-anchor="start">Policy weights</text><path d="M1005 414V436H207V414" fill="none" stroke="#1d7d76" stroke-width="2.4" marker-end="url(#arrow-10)"/><text x="604" y="460" fill="#6c7474" font-size="18" text-anchor="middle">Physical feedback</text></g></svg>